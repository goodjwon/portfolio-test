site_name: 홍길동의 개발 기록
site_url: https://goodjwon.github.io/portfolio-test/
site_description: Java·Spring 실습을 직접 만들고 검증한 기록
site_author: 홍길동
repo_url: https://github.com/goodjwon/portfolio-test

nav:
  - 소개: index.md
  - 실습 기록:
      - 실습 기록: blog/index.md

theme:
  name: material
  language: ko
  features:
    - content.code.copy
    - navigation.top
    - navigation.footer
    - search.highlight
    - navigation.tabs
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 어두운 화면으로
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 밝은 화면으로

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - blog:
      post_url_format: "{slug}"
      post_date_format: "yyyy년 M월 d일"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
